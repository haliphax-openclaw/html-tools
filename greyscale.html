<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Greyscale — drop an image</title>
  <style>
    :root {
      --border: #334155;
      --bg: #0f172a;
      --surface: #1e293b;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: #e2e8f0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: stretch;
      justify-content: center;
      max-width: 960px;
      width: 100%;
    }
    .panel {
      flex: 1 1 280px;
      min-height: 280px;
      max-width: 440px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel--drop {
      border-style: dashed;
      transition: border-color 0.15s, background 0.15s;
    }
    .panel--drop.dragover {
      border-color: var(--accent);
      background: #1e3a5f;
    }
    .panel--out {
      border-style: solid;
    }
    .panel__label {
      padding: 10px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .panel__body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      min-height: 220px;
    }
    .drop-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      pointer-events: none;
    }
    .drop-hint strong {
      color: var(--accent);
      font-weight: 600;
    }
    .panel img,
    .panel canvas {
      max-width: 100%;
      max-height: min(50vh, 360px);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      vertical-align: middle;
    }
    .hidden { display: none !important; }
    input[type="file"] {
      position: absolute;
      width: 0.1px;
      height: 0.1px;
      opacity: 0;
      overflow: hidden;
      z-index: -1;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="row">
    <section class="panel panel--drop" id="dropZone" aria-label="Image drop target">
      <div class="panel__label">Source</div>
      <div class="panel__body" id="sourceBody">
        <label for="fileInput" class="sr-only">Choose image file</label>
        <input type="file" id="fileInput" accept="image/*" />
        <div class="drop-hint" id="dropHint">
          <strong>Drop an image</strong> here<br />
          or click to browse
        </div>
        <img id="sourceImg" class="hidden" alt="Original image preview" />
      </div>
    </section>
    <section class="panel panel--out" aria-label="Greyscale result">
      <div class="panel__label">Greyscale</div>
      <div class="panel__body" id="outBody">
        <p class="drop-hint" id="outPlaceholder">Result appears here</p>
        <canvas id="outCanvas" class="hidden" aria-label="Greyscale image"></canvas>
      </div>
    </section>
  </div>
  <script>
    (function () {
      var dropZone = document.getElementById('dropZone');
      var fileInput = document.getElementById('fileInput');
      var dropHint = document.getElementById('dropHint');
      var sourceImg = document.getElementById('sourceImg');
      var outCanvas = document.getElementById('outCanvas');
      var outPlaceholder = document.getElementById('outPlaceholder');

      function luminance(r, g, b) {
        return Math.round(0.299 * r + 0.587 * g + 0.114 * b);
      }

      function toGreyscale(img) {
        var w = img.naturalWidth;
        var h = img.naturalHeight;
        if (!w || !h) return;
        outCanvas.width = w;
        outCanvas.height = h;
        var ctx = outCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        var imageData = ctx.getImageData(0, 0, w, h);
        var d = imageData.data;
        for (var i = 0; i < d.length; i += 4) {
          var y = luminance(d[i], d[i + 1], d[i + 2]);
          d[i] = d[i + 1] = d[i + 2] = y;
        }
        ctx.putImageData(imageData, 0, 0);
        outCanvas.classList.remove('hidden');
        outPlaceholder.classList.add('hidden');
      }

      function showSource(img) {
        sourceImg.src = img.src;
        sourceImg.classList.remove('hidden');
        dropHint.classList.add('hidden');
        toGreyscale(img);
      }

      function loadFile(file) {
        if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          showSource(img);
          URL.revokeObjectURL(url);
        };
        img.onerror = function () {
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }

      dropZone.addEventListener('click', function (e) {
        if (e.target === fileInput) return;
        fileInput.click();
      });

      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (f) loadFile(f);
        fileInput.value = '';
      });

      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (ev) {
        dropZone.addEventListener(ev, function (e) {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      dropZone.addEventListener('dragenter', function () {
        dropZone.classList.add('dragover');
      });
      dropZone.addEventListener('dragleave', function (e) {
        if (!dropZone.contains(e.relatedTarget)) {
          dropZone.classList.remove('dragover');
        }
      });
      dropZone.addEventListener('drop', function (e) {
        dropZone.classList.remove('dragover');
        var f = e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) loadFile(f);
      });
    })();
  </script>
</body>
</html>
